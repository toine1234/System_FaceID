<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Điểm Danh Khuôn Mặt - Realtime</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; }
        #video-feed { border: 2px solid #333; max-width: 640px; }
        #snapshot-container { margin-top: 20px; }
        #snapshot-img { border: 2px solid #ccc; max-width: 200px; display: none; }
        .notification { padding: 10px; margin: 10px 0; border-radius: 5px; font-weight: bold; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Điểm Danh Khuôn Mặt - Realtime Snapshot</h1>
        <p>Đưa khuôn mặt vào camera để tự động chụp và điểm danh.</p>
        
        <!-- Video Feed (Index Cũ) -->
        <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Video Feed">
        
        <!-- Snapshot Khung Dưới -->
        <div id="snapshot-container">
            <h3>Ảnh Đã Chụp & Kết Quả:</h3>
            <img id="snapshot-img" src="" alt="Snapshot">
            <div id="notification" class="notification"></div>
        </div>
        
        <button onclick="checkSnapshot()">Kiểm Tra Điểm Danh</button>
    </div>

    <script>
        function checkSnapshot() {
            fetch('/snapshot')
                .then(response => response.json())
                .then(data => {
                    const snapshotImg = document.getElementById('snapshot-img');
                    const notification = document.getElementById('notification');
                    
                    if (data.image_b64) {
                        snapshotImg.src = 'data:image/jpeg;base64,' + data.image_b64;
                        snapshotImg.style.display = 'block';
                        
                        if (data.result.success) {
                            notification.textContent = `Điểm danh thành công! - ${data.result.label} lúc ${data.result.timestamp}`;
                            notification.className = 'notification success';
                        } else {
                            notification.textContent = `Điểm danh thất bại - ${data.result.label}`;
                            notification.className = 'notification error';
                        }
                        notification.style.display = 'block';
                    } else if (data.error) {
                        notification.textContent = 'Chưa có ảnh chụp. Hãy đưa mặt vào camera!';
                        notification.className = 'notification error';
                        notification.style.display = 'block';
                    }
                })
                .catch(error => console.error('Error:', error));
        }
        
        // Auto-check mỗi 2s
        setInterval(checkSnapshot, 2000);
    </script>
</body>
</html>
